[package]
name = "sectool-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SECTOOL — interface de bureau du réseau et du pare-feu"

[lib]
name = "sectool_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sectool-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sectool-core = { workspace = true }
sectool-net = { workspace = true }
sectool-firewall = { workspace = true }
